name: nms-pm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-windshift}
      POSTGRES_USER: ${POSTGRES_USER:-windshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - nms-pm

  windshift:
    image: ghcr.io/windshiftapp/windshift:${WINDSHIFT_VERSION:-v0.8.8}
    restart: unless-stopped
    tmpfs:
      - /tmp:exec,size=64M
    mem_limit: ${WINDSHIFT_CONTAINER_MEMORY_LIMIT:-768m}
    env_file: .env
    environment:
      BASE_URL: ${PUBLIC_URL:-https://pm.newmarketsecurity.com}
      ALLOWED_HOSTS: ${PUBLIC_HOST:-pm.newmarketsecurity.com}
      USE_PROXY: "true"
      SSO_SECRET: ${SSO_SECRET:?set SSO_SECRET in .env}
      SESSION_IP_BINDING: ${SESSION_IP_BINDING:-log}
      WEBAUTHN_RP_ID: ${PUBLIC_HOST:-pm.newmarketsecurity.com}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-New Market Security}
      ENABLE_ADMIN_FALLBACK: ${ENABLE_ADMIN_FALLBACK:-true}
      WINDSHIFT_MEMORY_LIMIT_MB: ${WINDSHIFT_MEMORY_LIMIT_MB:-512}
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-windshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-windshift}
      POSTGRES_SSLMODE: disable
      ATTACHMENT_PATH: /data/attachments
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TLS_SKIP_VERIFY: "false"
    volumes:
      - windshift_data:/data
    ports:
      - "127.0.0.1:${LISTEN_HTTP_PORT:-8088}:8080"
    labels:
      - caddy=${PUBLIC_HOST:-pm.newmarketsecurity.com}
      - caddy.reverse_proxy={{upstreams 8080}}
      - traefik.enable=true
      - traefik.docker.network=${EDGE_NETWORK:-proxy}
      - traefik.http.routers.pm.rule=Host(`${PUBLIC_HOST:-pm.newmarketsecurity.com}`)
      - traefik.http.routers.pm.entrypoints=websecure
      - traefik.http.routers.pm.tls=true
      - traefik.http.routers.pm.tls.certresolver=letsencrypt
      - traefik.http.services.pm.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/windshift", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      nms-pm: {}
      edge: {}

volumes:
  postgres_data:
  windshift_data:

networks:
  nms-pm:
    name: nms-pm
  edge:
    name: ${EDGE_NETWORK:-proxy}
    external: true
